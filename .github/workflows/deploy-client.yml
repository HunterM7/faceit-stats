name: Deploy client

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        working-directory: client
        run: npm install
      - name: Build
        working-directory: client
        env:
          VITE_SERVER_URL: https://api.faceit-widgets.tonyx.ru
          VITE_SITE_URL: https://faceit-widgets.tonyx.ru
        run: npm run build
      - name: Upload
        uses: appleboy/scp-action@v1
        with:
          host: 212.118.45.215
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: client/dist/*
          target: /var/www/html
          strip_components: 2
