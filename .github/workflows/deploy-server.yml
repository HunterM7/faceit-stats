name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: server
        run: npm install
      - name: Build
        working-directory: server
        run: npm run build
      - name: Upload dist
        uses: appleboy/scp-action@v1
        with:
          host: 212.118.45.215
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: server/dist/*
          target: /opt/faceit-stats/server/dist
          strip_components: 2
      - name: Upload package.json
        uses: appleboy/scp-action@v1
        with:
          host: 212.118.45.215
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: server/package.json
          target: /opt/faceit-stats/server
          strip_components: 1
      - name: Restart
        uses: appleboy/ssh-action@v1
        with:
          host: 212.118.45.215
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/faceit-stats/server
            npm install --omit=dev --no-workspaces
            pm2 restart faceit-api
